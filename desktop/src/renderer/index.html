<!doctype html>
<html lang="en">
<head>

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'">
<title>AuthDeck Agent</title>
<link rel="stylesheet" href="styles.css">
<script src="renderer.js" defer></script>
</head>
<body>
<div class="app" id="app">

    <span class="logo c1 raised" aria-hidden="true"></span>
    <h1>AuthDeck Agent</h1>
    <span class="spacer"></span>
    <div class="raised" id="back-slot" hidden>
