<!doctype html>
<html lang="en" data-colorway="graphite">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AuthDeck privacy policy</title>
  <meta name="description" content="What the AuthDeck app, AuthDeck Agent and the authdeck.in website keep, where it stays and what they send.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#22262E">
  <link rel="canonical" href="{{SITE_URL}}privacy/">
  <link rel="icon" href="../favicon.ico" sizes="48x48">
  <link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../img/icon-180.png">
  <link rel="preload" href="../fonts/PixelifySans_600SemiBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../fonts/IBMPlexMono_400Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../style.css">
  <script src="../colorway.js"></script>
</head>
<body>
{{MARK_SPRITE}}
<a class="skip" href="#main">Skip to the content</a>

<header class="top">
  <div class="top-row wrap">
    <a class="brand" href="../" aria-label="AuthDeck home">
      <svg class="brand-mark" viewBox="0 0 17 18" shape-rendering="crispEdges" aria-hidden="true"><use href="#authdeck-mark"/></svg>
      <span class="brand-name">AuthDeck</span>
    </a>
    <div class="colorways" role="radiogroup" aria-label="Page colours">
      <button type="button" role="radio" class="swatch" data-set-colorway="graphite" aria-checked="true" title="Graphite"><span class="swatch-face"></span><span class="sr">Graphite</span></button>
      <button type="button" role="radio" class="swatch" data-set-colorway="paper" aria-checked="false" title="Paper"><span class="swatch-face"></span><span class="sr">Paper</span></button>
      <button type="button" role="radio" class="swatch" data-set-colorway="tide" aria-checked="false" title="Tide"><span class="swatch-face"></span><span class="sr">Tide</span></button>
    </div>
    <a class="btn btn-primary btn-small" href="../#download"><span class="btn-face">Download</span></a>
  </div>
</header>

<main id="main" class="band">
  <article class="wrap doc">
{{POLICY}}
  </article>
</main>

{{FOOTER}}
</body>
</html>
